name: Deploy Next.js Sample

on:
  push:
    branches: ["main"]
    paths:
      - 'web-sdk-samples/cortexscan-sample_next_app/**'
      - '.github/workflows/deploy-cortexscan-next.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        working-directory: ./web-sdk-samples/cortexscan-sample_next_app
        run: npm ci

      # --- NEW STEP: OVERWRITE CONFIG ON THE FLY ---
      # This configures the app for GitHub Pages without touching your source code.
      - name: Inject CI Config
        working-directory: ./web-sdk-samples/cortexscan-sample_next_app
        run: |
          echo "
          import type { NextConfig } from 'next';
          const nextConfig: NextConfig = {
            output: 'export',
            basePath: '/cortexdecoder-web-sdk/cortexscan-sample_next_app',
            images: { unoptimized: true },
          };
          export default nextConfig;
          " > next.config.ts

      - name: Build Next.js App
        working-directory: ./web-sdk-samples/cortexscan-sample_next_app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-sdk-samples/cortexscan-sample_next_app/out
          target-folder: cortexscan-sample_next_app
          clean: false