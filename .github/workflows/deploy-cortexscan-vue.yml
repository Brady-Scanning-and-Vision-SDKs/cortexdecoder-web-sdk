name: Deploy Vue Sample

on:
  push:
    branches: ["main"]
    paths:
      - 'web-sdk-samples/cortexscan-sample_vue_app/**'
      - '.github/workflows/deploy-cortexscan-vue.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        working-directory: ./web-sdk-samples/cortexscan-sample_vue_app
        run: npm ci

      - name: Build Vue App
        working-directory: ./web-sdk-samples/cortexscan-sample_vue_app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # Vite typically outputs to 'dist'. Check your local build to confirm.
          folder: web-sdk-samples/cortexscan-sample_vue_app/dist
          target-folder: cortexscan-sample_vue_app
          clean: false # CRITICAL: Keeps other apps alive