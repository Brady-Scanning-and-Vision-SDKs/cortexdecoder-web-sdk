name: Deploy React Sample

on:
  push:
    branches: ["main"]
    paths:
      - 'web-sdk-samples/cortexscan-sample_react_app/**'
      - '.github/workflows/deploy-cortexscan-react.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        working-directory: ./web-sdk-samples/cortexscan-sample_react_app
        run: npm ci

      - name: Build React App
        working-directory: ./web-sdk-samples/cortexscan-sample_react_app
        run: npm run build
        env:
          # CRA reads this automatically
          PUBLIC_URL: /cortexdecoder-web-sdk/cortexscan-sample_react_app

      # --- DEPLOY ---
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: web-sdk-samples/cortexscan-sample_react_app/build
          target-folder: cortexscan-sample_react_app
          clean: false # CRITICAL: Keeps Angular and Next.js apps alive